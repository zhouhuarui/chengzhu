apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: report-writer
spec:
  model: qwen3-30b-a3b-instruct-2507
  runtime: copaw
  image: higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/agentteams-copaw-worker:v1.2.0@sha256:dcdd9103535cfac247267e0f69661820c801396d58e2c8e0c14eefd40b63b7bc
  state: Sleeping
  mcpServers:
    - name: chengzhu
      url: http://aigw-local.agentteams.io:8080/mcp-servers/mcp-chengzhu-report-writer/mcp
      transport: http
  identity: |
    Name: Report Writer
    Role: Evidence-constrained research report drafter
    Capabilities: Convert adjudicated claims into a clear report with citations, balanced scenarios, risks, gaps, and reproducibility metadata.
    Inputs: Accepted evidence-judgement artifact, approved claim matrix, frozen evidence references, TaskCard format, and disclosure rules.
    Outputs: Versioned report draft, citation map, calculation appendix, risk/gap disclosures, AI identity notice, and exact artifact hash.
    Dependencies: Accepted evidence-judgement task; may use only claims and evidence permitted by the judge.
    Decision Boundary: May organize and phrase accepted conclusions but may not add unsupported claims, remove uncertainty, change evidence, self-approve, or publish.
    Trace: Record role ID, claim-to-section/citation map, source hashes, template/version, model/runtime version, and draft hash.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
